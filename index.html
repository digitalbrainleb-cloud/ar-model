<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Model Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { 
      margin: 0;
      font-family: Arial, sans-serif;
    }
    
    .models-list {
      padding: 20px;
      max-width: 400px;
      margin: 0 auto;
    }
    
    .model-item {
      background: #f5f5f5;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      text-align: center;
    }
    
    .model-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    
    .ar-button {
      background: #4285f4;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
    }
    
    .ar-button:hover {
      background: #3367d6;
    }
    
    /* Hidden fullscreen viewer */
    .fullscreen-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
    }
  </style>
</head>
<body>
  <!-- List of models -->
  <div class="models-list">
    <div class="model-item">
      <div class="model-name">Main Model</div>
      <button class="ar-button" onclick="openModel('model.glb', 'model.usdz', 'Main Model')">
        👋 View in AR
      </button>
    </div>
    
    <div class="model-item">
      <div class="model-name">Shaker</div>
      <button class="ar-button" onclick="openModel('model-shaker.glb', 'model-shaker.usdz', 'Shaker')">
        👋 View in AR
      </button>
    </div>
    
    <div class="model-item">
      <div class="model-name">Christmas Frame</div>
      <button class="ar-button" onclick="openModel('model-shaker-christmas-frame.glb', 'model-christmas-frame.usdz', 'Christmas Frame')">
        👋 View in AR
      </button>
    </div>
  </div>

  <!-- Fullscreen viewer (hidden by default) -->
  <div class="fullscreen-viewer" id="fullscreen-viewer">
    <model-viewer
      id="ar-viewer"
      alt="3D Model"
      ar
      ar-modes="webxr quick-look"
      camera-controls
      auto-rotate
      shadow-intensity="1">
      
      <button slot="ar-button" style="
        position: absolute;
        top: 20px;
        right: 20px;
        padding: 10px 20px;
        background-color: #4285f4;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;">
        👋 View in AR
      </button>
      
    </model-viewer>
  </div>

  <script>
    function openModel(glbFile, usdzFile, modelName) {
      const viewer = document.getElementById('ar-viewer');
      const fullscreenDiv = document.getElementById('fullscreen-viewer');
      
      // Set the model files
      viewer.src = glbFile;
      if (usdzFile) {
        viewer.iOSsrc = usdzFile;
      }
      viewer.alt = modelName;
      
      // Show the fullscreen viewer
      fullscreenDiv.style.display = 'block';
      
      // Hide the models list
      document.querySelector('.models-list').style.display = 'none';
      
      // Add back button
      const backButton = document.createElement('button');
      backButton.textContent = '← Back';
      backButton.style.cssText = `
        position: absolute;
        top: 20px;
        left: 20px;
        padding: 10px 20px;
        background-color: white;
        color: #333;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        z-index: 1000;
      `;
      
      backButton.onclick = function() {
        fullscreenDiv.style.display = 'none';
        document.querySelector('.models-list').style.display = 'block';
        this.remove();
      };
      
      document.body.appendChild(backButton);
    }
  </script>
</body>
</html>
