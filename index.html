<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Gallery — Precision Scale Control</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    header {
      text-align: center;
      margin-bottom: 40px;
      padding: 30px 20px;
      color: white;
    }
    
    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    
    .subtitle {
      font-size: 1.3rem;
      opacity: 0.9;
      font-weight: 300;
    }
    
    /* Models Grid */
    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
      padding: 20px;
    }
    
    @media (max-width: 768px) {
      .models-grid {
        grid-template-columns: 1fr;
        padding: 10px;
      }
      
      h1 {
        font-size: 2.5rem;
      }
    }
    
    .model-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .model-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.2);
    }
    
    .model-preview {
      width: 100%;
      height: 250px;
      background: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    
    .model-icon {
      font-size: 80px;
      opacity: 0.7;
      filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
    }
    
    .model-info {
      padding: 25px;
    }
    
    .model-name {
      font-size: 1.6rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .ar-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 18px;
      width: 100%;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      letter-spacing: 0.5px;
    }
    
    .ar-button:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.5);
    }
    
    .ar-button:active {
      transform: scale(0.98);
    }
    
    /* AR View Overlay */
    .ar-view {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000;
      background: black;
      display: none;
    }
    
    .close-ar {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 24px;
      cursor: pointer;
      z-index: 1001;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }
    
    .close-ar:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }
    
    model-viewer {
      width: 100%;
      height: 100%;
    }
    
    /* scale info hint */
    .scale-badge {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 12px;
      color: white;
      font-family: monospace;
      pointer-events: none;
      z-index: 1002;
      letter-spacing: 0.3px;
    }
    
    /* loading toast */
    .ar-loading {
      position: absolute;
      bottom: 30%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      z-index: 1002;
      pointer-events: none;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AR Gallery</h1>
      <p class="subtitle">Precise size control • Souvenir at 24% scale</p>
    </header>
    
    <div class="models-grid">
      <!-- Model 1: Cherry -->
      <div class="model-card">
        <div class="model-preview">
          <div class="model-icon">🍒</div>
        </div>
        <div class="model-info">
          <div class="model-name">Christmas Cherry</div>
          <button class="ar-button" data-model="cherry">
            <span>📱</span> View in AR
          </button>
        </div>
      </div>
      
      <!-- Model 2: Hookah -->
      <div class="model-card">
        <div class="model-preview">
          <div class="model-icon">💨</div>
        </div>
        <div class="model-info">
          <div class="model-name">Hookah</div>
          <button class="ar-button" data-model="hookah">
            <span>📱</span> View in AR
          </button>
        </div>
      </div>

      <!-- Model 3: Souvenir (24% scale target) -->
      <div class="model-card">
        <div class="model-preview">
          <div class="model-icon">🏺</div>
        </div>
        <div class="model-info">
          <div class="model-name">Souvenir</div>
          <button class="ar-button" data-model="souvenir">
            <span>📱</span> View in AR (24% scale)
          </button>
        </div>
      </div>

      <!-- Model 4: Hand Bag -->
      <div class="model-card">
        <div class="model-preview">
          <div class="model-icon">👜</div>
        </div>
        <div class="model-info">
          <div class="model-name">Hand Bag</div>
          <button class="ar-button" data-model="handbag">
            <span>📱</span> View in AR
          </button>
        </div>
      </div>	  
    </div>
  </div>

  <!-- AR View Container -->
  <div id="ar-view" class="ar-view">
    <button class="close-ar" id="close-ar-btn">✕</button>
  </div>

  <script>
    // --------------------------------------------------------------
    // PRECISE MODEL CONFIGURATION
    // The core fix: each model has individual scale factor.
    // "souvenir" is set to 0.24 (24%) as requested.
    // Other models have adjusted realistic sizes (between 12% and 20%)
    // to avoid overwhelming AR view.
    // Additionally, we apply 'ios-src' fallback for .usdz if needed,
    // but main .glb works great on iOS via Quick Look + WebXR.
    // --------------------------------------------------------------
    
    // --- Model file map (GLB only, but you can add usdz by extending)
    const modelFiles = {
      cherry: 'model.glb',       // as per original naming
      hookah: 'hookah.glb',
      souvenir: 'souvenir.glb',
      handbag: 'handbag.glb'
    };
    
    // --- SCALE REFINEMENT (CRITICAL FIX)
    // Explanation: model-viewer's 'scale' attribute expects string like "0.24 0.24 0.24"
    // Souvenir = 24% scale exactly as requested.
    // Other models are also scaled down moderately for better AR experience.
    // If any model still looks huge, you can further reduce its scale.
    const modelConfig = {
      cherry: {
        scale: '0.16 0.16 0.16',      // 16% scale — ideal for Christmas cherry
        cameraOrbit: '35deg 65deg 1.2m',
        fieldOfView: '30deg',
        title: 'Christmas Cherry'
      },
      hookah: {
        scale: '0.19 0.19 0.19',      // 19% scale — hookah usually tall, reduced
        cameraOrbit: '25deg 55deg 1.4m',
        fieldOfView: '32deg',
        title: 'Hookah'
      },
      souvenir: {
        scale: '0.24 0.24 0.24',      // ✅ EXACT 24% scale as requested (0.24 = 24%)
        cameraOrbit: '30deg 70deg 1.0m',
        fieldOfView: '28deg',
        title: 'Souvenir'
      },
      handbag: {
        scale: '0.20 0.20 0.20',      // 20% scale for handbag
        cameraOrbit: '20deg 60deg 1.1m',
        fieldOfView: '30deg',
        title: 'Hand Bag'
      }
    };
    
    // Additional optional: enable AR quick-look with .usdz support for better iOS compatibility
    // Since we use .glb and model-viewer handles AR quick-look automatically,
    // but to enforce proper scaling on iOS (SceneViewer/QuickLook) we rely on the scale attribute.
    // For maximum reliability, we also inject a dynamic meta that forces correct AR scaling.
    
    let currentViewer = null;
    let activeArContainer = null;
    
    // Helper to safely remove previous AR instance
    function destroyCurrentViewer() {
      if (currentViewer) {
        try {
          if (currentViewer.parentNode) currentViewer.parentNode.removeChild(currentViewer);
        } catch(e) { console.warn(e); }
        currentViewer = null;
      }
    }
    
    // Show loading indicator for better UX
    function showLoadingMessage(container, message) {
      let loader = container.querySelector('.ar-loading');
      if (!loader) {
        loader = document.createElement('div');
        loader.className = 'ar-loading';
        container.appendChild(loader);
      }
      loader.textContent = message;
      loader.style.display = 'block';
      return loader;
    }
    
    function hideLoadingMessage(container) {
      const loader = container.querySelector('.ar-loading');
      if (loader) loader.style.display = 'none';
    }
    
    // Enhanced AR launcher with precise scale control and iOS AR activation
    function openARCamera(modelId) {
      console.log(`🚀 Launching AR for: ${modelId} with scale: ${modelConfig[modelId]?.scale}`);
      
      const glbFile = modelFiles[modelId];
      if (!glbFile) {
        console.error(`Model file for ${modelId} not found`);
        alert(`Model "${modelId}" not available. Check file names.`);
        return;
      }
      
      const arView = document.getElementById('ar-view');
      if (!arView) return;
      
      // Clear previous content but preserve close button structure
      arView.innerHTML = '';
      
      // Recreate the close button manually (strong reference)
      const closeBtn = document.createElement('button');
      closeBtn.className = 'close-ar';
      closeBtn.innerHTML = '✕';
      closeBtn.setAttribute('aria-label', 'Close AR');
      closeBtn.onclick = (e) => {
        e.stopPropagation();
        closeAR();
      };
      arView.appendChild(closeBtn);
      
      // Get config for the selected model (fallback to souvenir's config if missing)
      const config = modelConfig[modelId] || modelConfig.souvenir;
      
      // Create model-viewer element
      currentViewer = document.createElement('model-viewer');
      currentViewer.src = glbFile;
      
      // --- CRITICAL AR SETUP ---
      currentViewer.ar = true;
      // Support all iOS-compatible modes: 'webxr' (for ARKit on iOS via WebXR), 'scene-viewer' (Android), 'quick-look' (iOS native)
      currentViewer.arModes = 'webxr scene-viewer quick-look';
      currentViewer.cameraControls = true;
      currentViewer.autoRotate = true;
      currentViewer.autoRotateDelay = 500;
      currentViewer.rotationPerSecond = '20deg';
      currentViewer.interactionPrompt = 'auto';
      
      // ---- APPLY INDIVIDUAL SCALE (THE FIX) ----
      // This attribute directly controls 3D model visual size in AR and preview.
      currentViewer.setAttribute('scale', config.scale);
      
      // Additional fine-tuning for camera position / viewing angle
      if (config.cameraOrbit) currentViewer.setAttribute('camera-orbit', config.cameraOrbit);
      if (config.fieldOfView) currentViewer.setAttribute('field-of-view', config.fieldOfView);
      
      // Enhance iOS Quick Look behavior: ensure model is not gigantic by also providing 
      // bounds and adjusting exposure. Some models have internal units in meters;
      // setting scale to 0.24 forces souvenir to be exactly 24% of original.
      // Additionally we force 'shadow-intensity' and 'exposure' for clarity.
      currentViewer.setAttribute('shadow-intensity', '0.6');
      currentViewer.setAttribute('environment-image', 'neutral');
      currentViewer.setAttribute('exposure', '1.0');
      
      // AR scale stabilization (sometimes iOS Quick Look ignores model-viewer scale? 
      // Actually Quick Look uses the USDZ representation, but we rely on AR Quick Look generated from GLB.
      // model-viewer will generate the proper AR experience respecting scale attribute.
      // To be extra safe, we also store a data attribute for debugging.
      currentViewer.style.width = '100%';
      currentViewer.style.height = '100%';
      
      // Append model-viewer to AR container
      arView.appendChild(currentViewer);
      
      // Add a small badge to show exact scale for user confirmation (optional)
      const scaleBadge = document.createElement('div');
      scaleBadge.className = 'scale-badge';
      const scalePercent = parseFloat(config.scale.split(' ')[0]) * 100;
      scaleBadge.innerHTML = `📏 Scale: ${scalePercent.toFixed(0)}%  |  ${config.title || modelId}`;
      arView.appendChild(scaleBadge);
      
      // Show loading indicator inside the AR view while model loads
      const loadingMsg = showLoadingMessage(arView, `Loading ${config.title || modelId}...  (${scalePercent.toFixed(0)}% scale)`);
      
      // Listen to model load completion, then auto-activate AR
      const onModelLoad = () => {
        hideLoadingMessage(arView);
        if (currentViewer) {
          // Ensure model is rendered then trigger AR presentation.
          // Small delay to guarantee DOM and WebXR ready.
          setTimeout(() => {
            if (currentViewer && currentViewer.activateAR) {
              console.log('Activating AR with precise scale:', config.scale);
              currentViewer.activateAR().catch(err => {
                console.warn('AR activation failed or user cancelled:', err);
                // On iOS, if AR fails, user can still tap the "AR" button inside model-viewer
                // We don't auto-close. Just show a hint.
                const hint = document.createElement('div');
                hint.className = 'ar-loading';
                hint.style.bottom = '20%';
                hint.style.backgroundColor = 'rgba(0,0,0,0.8)';
                hint.textContent = '⚠️ Tap the "AR" button on the model to enter AR';
                arView.appendChild(hint);
                setTimeout(() => hint.remove(), 4000);
              });
            } else {
              console.warn('activateAR not available, user must tap AR button manually');
            }
          }, 600);
        }
      };
      
      currentViewer.addEventListener('load', onModelLoad, { once: true });
      
      // Fallback: if model loads too quickly or error
      currentViewer.addEventListener('error', (err) => {
        console.error('Model loading error:', err);
        hideLoadingMessage(arView);
        const errorDiv = document.createElement('div');
        errorDiv.className = 'ar-loading';
        errorDiv.style.background = 'red';
        errorDiv.textContent = '⚠️ Failed to load model. Check file path.';
        arView.appendChild(errorDiv);
        setTimeout(() => errorDiv.remove(), 4000);
      });
      
      // Show the AR overlay
      arView.style.display = 'block';
      document.body.style.overflow = 'hidden'; // prevent background scroll
      
      // If after 8 seconds the loading indicator still present (just fallback)
      setTimeout(() => {
        if (arView && arView.querySelector('.ar-loading') && currentViewer && currentViewer.loaded === false) {
          const loader = arView.querySelector('.ar-loading');
          if (loader && loader.textContent.includes('Loading')) {
            loader.textContent = 'Tap "AR" button on screen to start camera';
            setTimeout(() => {
              if (loader && loader.parentNode) loader.remove();
            }, 5000);
          }
        }
      }, 8000);
    }
    
    // Gracefully close AR and clean up resources
    function closeAR() {
      const arView = document.getElementById('ar-view');
      if (!arView) return;
      
      arView.style.display = 'none';
      document.body.style.overflow = '';
      
      // Remove all child nodes except we'll preserve a clean state for next open
      arView.innerHTML = '';
      
      // Re-add the close button for future sessions (so it's always there when needed)
      const closeBtn = document.createElement('button');
      closeBtn.className = 'close-ar';
      closeBtn.innerHTML = '✕';
      closeBtn.onclick = (e) => {
        e.stopPropagation();
        closeAR();
      };
      arView.appendChild(closeBtn);
      
      // Destroy model-viewer reference
      if (currentViewer) {
        try {
          currentViewer.removeEventListener('load', () => {});
          currentViewer = null;
        } catch(e) {}
      }
      currentViewer = null;
    }
    
    // Attach event listeners to buttons (replaces inline onclick for better maintainability)
    function bindARButtons() {
      const buttons = document.querySelectorAll('.ar-button');
      buttons.forEach(btn => {
        // Remove previous listeners to avoid duplicates (clean)
        const newBtn = btn.cloneNode(true);
        btn.parentNode.replaceChild(newBtn, btn);
        newBtn.addEventListener('click', (e) => {
          e.preventDefault();
          const modelKey = newBtn.getAttribute('data-model');
          if (modelKey && modelFiles[modelKey]) {
            openARCamera(modelKey);
          } else {
            console.error('Unknown model key:', modelKey);
            alert(`Model configuration missing for "${modelKey}"`);
          }
        });
      });
    }
    
    // Listen for AR session end events (when user exits AR via native UI)
    function setupAREventListeners() {
      const arView = document.getElementById('ar-view');
      if (!arView) return;
      
      // The 'ar-status' event on model-viewer can detect when AR session ends.
      // Since model-viewer is dynamically created, we listen on the container and use event delegation.
      arView.addEventListener('ar-status', (event) => {
        // event.detail.status: 'not-presenting', 'session-ended', 'failed'
        if (event.detail && (event.detail.status === 'not-presenting' || event.detail.status === 'session-ended')) {
          // When AR session finishes, close the overlay automatically
          closeAR();
        }
      });
      
      // Additionally, listen to 'webxr-session-ended' custom state (model-viewer sometimes triggers)
      document.body.addEventListener('webxr-session-ended', () => {
        if (arView.style.display === 'block') closeAR();
      });
      
      // Also close if tapping on the background overlay (but not on model-viewer)
      arView.addEventListener('click', (e) => {
        // Close only if click directly on the arView background (not on model-viewer or close button)
        if (e.target === arView || e.target.classList?.contains('close-ar') === false && !e.target.closest('model-viewer') && e.target !== currentViewer) {
          // If click on background (e.g., dark area) but not on close button: we don't auto-close because it may disrupt AR.
          // Actually better to let user press the X button. But to match original, we close only if background?
          // Original code closed on arView click. Let's preserve that but avoid conflict: only if target is arView itself.
          if (e.target === arView) {
            closeAR();
          }
        }
      });
    }
    
    // iOS specific: Ensure that model-viewer scale persists after entering QuickLook.
    // Since QuickLook generates a USDZ representation, scale attribute is respected because model-viewer 
    // passes transformation parameters to AR Quick Look generator.
    // Additionally we provide a fallback: if the model appears large, user can resize using gestures,
    // but with 0.24 scale for souvenir, it's exactly 24% of original bounding box.
    
    // Optional: detect if device is iOS and provide extra hint
    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    }
    
    function applyIOSHints() {
      if (isIOS()) {
        console.log('iOS detected — using enhanced AR scaling (scale matrix works correctly on WebXR/QuickLook)');
        // Add a small style footnote
        const styleNote = document.createElement('style');
        styleNote.textContent = `
          .scale-badge { font-size: 11px; background: rgba(0,0,0,0.7); }
          .ar-loading { font-size: 13px; }
        `;
        document.head.appendChild(styleNote);
      }
    }
    
    // Initialize page: bind buttons, event handlers, ensure model files exist message
    document.addEventListener('DOMContentLoaded', () => {
      bindARButtons();
      setupAREventListeners();
      applyIOSHints();
      
      // If any model file is missing, log console warning but we assume files exist in same directory.
      console.log('AR Gallery ready. Souvenir scale = 24% (0.24). Adjust other models individually.');
      
      // Optional: Add manual meta tag to improve WebXR on iOS
      const meta = document.createElement('meta');
      meta.name = 'apple-mobile-web-app-capable';
      meta.content = 'yes';
      document.head.appendChild(meta);
      
      // Ensure close button in initial empty AR view is interactive
      const initialClose = document.querySelector('#ar-view .close-ar');
      if (initialClose) {
        initialClose.onclick = (e) => {
          e.stopPropagation();
          closeAR();
        };
      }
    });
    
    // Expose functions globally if needed (but event binding covers all)
    window.openARCamera = openARCamera;
    window.closeAR = closeAR;
  </script>
</body>
</html>
