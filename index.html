<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Models - Fixed Scaling</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    header {
      text-align: center;
      margin-bottom: 40px;
      padding: 30px 20px;
      color: white;
    }
    
    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      font-weight: 800;
    }
    
    .subtitle {
      font-size: 1.3rem;
      opacity: 0.9;
    }
    
    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
      padding: 20px;
    }
    
    @media (max-width: 768px) {
      .models-grid {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 2rem;
      }
    }
    
    .model-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }
    
    .model-card:hover {
      transform: translateY(-10px);
    }
    
    .model-preview {
      width: 100%;
      height: 250px;
      background: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .model-icon {
      font-size: 80px;
      opacity: 0.7;
    }
    
    .model-info {
      padding: 25px;
    }
    
    .model-name {
      font-size: 1.6rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .ar-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 18px;
      width: 100%;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    
    .ar-button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AR Gallery</h1>
      <p class="subtitle">Models open at the perfect size automatically</p>
    </header>
    
    <div class="models-grid">
      <!-- Christmas Cherry -->
      <div class="model-card">
        <div class="model-preview">
          <div class="model-icon">🍒</div>
        </div>
        <div class="model-info">
          <div class="model-name">Christmas Cherry</div>
          <button class="ar-button" onclick="openAR('model.glb', 'model.usdz', 0.35)">
            <span>📱</span> View in AR
          </button>
        </div>
      </div>
      
      <!-- Hookah -->
      <div class="model-card">
        <div class="model-preview">
          <div class="model-icon">💨</div>
        </div>
        <div class="model-info">
          <div class="model-name">Hookah</div>
          <button class="ar-button" onclick="openAR('hookah.glb', 'hookah.usdz', 0.40)">
            <span>📱</span> View in AR
          </button>
        </div>
      </div>

      <!-- Souvenir - YOUR 24% FIX -->
      <div class="model-card">
        <div class="model-preview">
          <div class="model-icon">🏺</div>
        </div>
        <div class="model-info">
          <div class="model-name">Souvenir</div>
          <button class="ar-button" onclick="openAR('souvenir.glb', 'souvenir.usdz', 0.24)">
            <span>📱</span> View in AR
          </button>
        </div>
      </div>

      <!-- Hand Bag -->
      <div class="model-card">
        <div class="model-preview">
          <div class="model-icon">👜</div>
        </div>
        <div class="model-info">
          <div class="model-name">Hand Bag</div>
          <button class="ar-button" onclick="openAR('handbag.glb', 'handbag.usdz', 0.35)">
            <span>📱</span> View in AR
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Detect platform
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isAndroid = /Android/.test(navigator.userAgent);
    
    // Get the base URL for your models
    const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
    
    function openAR(glbFile, usdzFile, desiredScale) {
      console.log(`Opening AR with scale: ${desiredScale * 100}%`);
      console.log(`Platform: ${isIOS ? 'iOS' : isAndroid ? 'Android' : 'Other'}`);
      
      if (isIOS) {
        // iOS: Use AR Quick Look with USDZ file and scale parameter
        const usdzUrl = baseUrl + usdzFile;
        // The #scale=X parameter works on iOS 15.5+ to set initial scale
        const arUrl = `${usdzUrl}#scale=${desiredScale}`;
        
        console.log('Opening iOS AR Quick Look:', arUrl);
        
        // Create an anchor element with ar attribute
        const link = document.createElement('a');
        link.rel = 'ar';
        link.href = arUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
      } else if (isAndroid) {
        // Android: Use Scene Viewer Intent with GLB file and scale parameter
        const modelUrl = baseUrl + glbFile;
        const encodedUrl = encodeURIComponent(modelUrl);
        
        // Android Intent with scale parameter - THIS WORKS!
        const intentUrl = `intent://arvr.google.com/scene-viewer/1.0?file=${encodedUrl}&mode=ar_preferred&enable_scale=true&scale=${desiredScale}#Intent;scheme=https;package=com.google.ar.core;end;`;
        
        console.log('Opening Android Scene Viewer with scale:', desiredScale);
        window.location.href = intentUrl;
        
        // Fallback if intent fails (opens in browser)
        setTimeout(() => {
          window.location.href = `https://arvr.google.com/scene-viewer/1.0?file=${encodedUrl}&mode=ar_preferred&enable_scale=true&scale=${desiredScale}`;
        }, 500);
        
      } else {
        // Desktop: Show message
        alert('AR is only supported on mobile devices (iOS or Android). Please open this page on your phone.');
      }
    }
    
    console.log('AR Gallery Ready!');
    console.log(`iOS: ${isIOS}, Android: ${isAndroid}`);
    console.log('Souvenir will open at 24% scale automatically on both platforms!');
  </script>
</body>
</html>
