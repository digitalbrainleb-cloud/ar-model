<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Models</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    header {
      text-align: center;
      margin-bottom: 40px;
      padding: 30px 20px;
      color: white;
    }
    
    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    
    .subtitle {
      font-size: 1.3rem;
      opacity: 0.9;
      font-weight: 300;
    }
    
    /* Models Grid */
    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
      padding: 20px;
    }
    
    @media (max-width: 768px) {
      .models-grid {
        grid-template-columns: 1fr;
        padding: 10px;
      }
      
      h1 {
        font-size: 2.5rem;
      }
    }
    
    .model-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .model-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.2);
    }
    
    .model-preview {
      width: 100%;
      height: 250px;
      background: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    
    .model-icon {
      font-size: 80px;
      opacity: 0.7;
      filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
    }
    
    .model-info {
      padding: 25px;
    }
    
    .model-name {
      font-size: 1.6rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .ar-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 18px;
      width: 100%;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      letter-spacing: 0.5px;
    }
    
    .ar-button:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.5);
    }
    
    .ar-button:active {
      transform: scale(0.98);
    }
    
    /* Hidden AR container */
    #ar-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000;
      background: black;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AR Gallery</h1>
      <p class="subtitle">Tap any button to launch AR camera instantly</p>
    </header>
    
    <div class="models-grid">
      <!-- Model 1 -->
      <div class="model-card">
        <div class="model-preview">
          <div class="model-icon">🧊</div>
        </div>
        <div class="model-info">
          <div class="model-name">Crystal Model</div>
          <button class="ar-button" onclick="openARCamera('model.glb')">
            <span>📱</span> View in AR
          </button>
        </div>
      </div>
      
      <!-- Model 2 -->
      <div class="model-card">
        <div class="model-preview">
          <div class="model-icon">💎</div>
        </div>
        <div class="model-info">
          <div class="model-name">Hookah</div>
          <button class="ar-button" onclick="openARCamera('hookah.glb')">
            <span>📱</span> View in AR
          </button>
        </div>
      </div>
      
      <!-- Add more models as needed -->
    </div>
  </div>

  <!-- AR Container - Hidden by default -->
  <div id="ar-container"></div>

  <script>
    async function openARCamera(glbFile) {
      console.log('Launching AR for:', glbFile);
      
      const container = document.getElementById('ar-container');
      container.innerHTML = '';
      
      // Create model-viewer
      const viewer = document.createElement('model-viewer');
      viewer.src = glbFile;
      viewer.ar = true;
      viewer.arModes = 'webxr scene-viewer quick-look';
      viewer.cameraControls = true;
      viewer.autoRotate = true;
      viewer.style.width = '100%';
      viewer.style.height = '100%';
      
      container.appendChild(viewer);
      container.style.display = 'block';
      
      // Auto-launch AR after a short delay
      setTimeout(() => {
        if (viewer.activateAR) {
          viewer.activateAR();
        }
      }, 300);
      
      // Close AR when session ends (when user exits AR mode)
      viewer.addEventListener('ar-status', (event) => {
        if (event.detail.status === 'not-presenting') {
          container.style.display = 'none';
          container.innerHTML = '';
        }
      });
      
      // Also close if user taps outside on mobile
      container.addEventListener('click', function(e) {
        if (e.target === container) {
          container.style.display = 'none';
          container.innerHTML = '';
        }
      });
    }
    
    // Optional: Preload models for faster loading
    window.addEventListener('load', function() {
      const modelFiles = ['model.glb', 'hookah.glb'];
      modelFiles.forEach(file => {
        const link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'fetch';
        link.href = file;
        document.head.appendChild(link);
      });
    });
  </script>
</body>
</html>
