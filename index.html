<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AR Models</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
    }
    .model {
      background: #f5f5f5;
      padding: 15px;
      margin: 10px 0;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .model-name {
      font-size: 18px;
      font-weight: bold;
    }
    button {
      background: #007AFF;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #0056CC;
    }
  </style>
</head>
<body>
  <h1>AR Models</h1>
  
  <div class="model">
    <div class="model-name">Main Model</div>
    <button onclick="openAR('model.glb', 'model.usdz')">View in AR</button>
  </div>
  
  <div class="model">
    <div class="model-name">Shaker</div>
    <button onclick="openAR('model-shaker.glb', 'model-shaker.usdz')">View in AR</button>
  </div>
  
  <div class="model">
    <div class="model-name">Christmas Frame</div>
    <button onclick="openAR('model-shaker-christmas-frame.glb', 'model-christmas-frame.usdz')">View in AR</button>
  </div>

  <script>
    function openAR(glbFile, usdzFile) {
      // Create a simple AR viewer page
      const arHTML = `
      <!DOCTYPE html>
      <html>
      <head>
        <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
        <style>
          body { margin: 0; }
          model-viewer { width: 100vw; height: 100vh; }
        </style>
      </head>
      <body>
        <model-viewer
          src="${glbFile}"
          ios-src="${usdzFile}"
          ar
          ar-modes="webxr scene-viewer quick-look"
          camera-controls
          auto-rotate>
          <button slot="ar-button" style="
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
          ">
            View in AR
          </button>
        </model-viewer>
      </body>
      </html>
      `;
      
      // Open in new tab
      const newTab = window.open();
      newTab.document.write(arHTML);
      newTab.document.close();
    }
  </script>
</body>
</html>
